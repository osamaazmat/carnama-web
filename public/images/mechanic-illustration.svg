<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <rect x="100" y="200" width="600" height="300" fill="#2d2d2d" rx="20"/>
  
  <!-- Car on Lift -->
  <path d="M250 350 L550 350 L520 280 L280 280 Z" fill="#1a1a1a"/>
  <path d="M300 280 L500 280 L480 240 L320 240 Z" fill="#2d2d2d"/>
  <circle cx="300" cy="350" r="30" fill="#1a1a1a"/>
  <circle cx="500" cy="350" r="30" fill="#1a1a1a"/>
  
  <!-- Lift Structure -->
  <rect x="200" y="400" width="400" height="20" fill="#ffffff"/>
  <rect x="250" y="420" width="300" height="10" fill="#ffffff"/>
  
  <!-- Mechanic Figure -->
  <circle cx="400" cy="450" r="20" fill="#ffffff"/> <!-- Head -->
  <rect x="390" y="470" width="20" height="40" fill="#ffffff"/> <!-- Body -->
  <path d="M390 470 L370 500" stroke="#ffffff" stroke-width="4"/> <!-- Left Arm -->
  <path d="M410 470 L430 500" stroke="#ffffff" stroke-width="4"/> <!-- Right Arm -->
  <path d="M390 510 L380 540" stroke="#ffffff" stroke-width="4"/> <!-- Left Leg -->
  <path d="M410 510 L420 540" stroke="#ffffff" stroke-width="4"/> <!-- Right Leg -->
  
  <!-- Tools -->
  <path d="M430 500 L450 480" stroke="#ffffff" stroke-width="4"/> <!-- Wrench -->
  <circle cx="450" cy="480" r="5" fill="#ffffff"/> <!-- Wrench Head -->
  
  <!-- Workshop Elements -->
  <rect x="150" y="200" width="100" height="150" fill="#1a1a1a" rx="10"/> <!-- Tool Cabinet -->
  <rect x="170" y="220" width="60" height="10" fill="#ffffff"/> <!-- Cabinet Drawer -->
  <rect x="170" y="240" width="60" height="10" fill="#ffffff"/> <!-- Cabinet Drawer -->
  <rect x="170" y="260" width="60" height="10" fill="#ffffff"/> <!-- Cabinet Drawer -->
  
  <!-- Decorative Elements -->
  <circle cx="400" cy="200" r="40" fill="#ffffff" fill-opacity="0.1"/> <!-- Light Effect -->
  <path d="M400 160 L400 240" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/> <!-- Light Beam -->
</svg> 